name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  cmake:
    name: CMake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  matrix-build:
    name: ${{ matrix.distro }} / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu, cc: gcc }
          - { distro: ubuntu, cc: clang }
          - { distro: fedora, cc: gcc }
          - { distro: fedora, cc: clang }
          - { distro: arch,   cc: gcc }
          - { distro: arch,   cc: clang }
    
    # This runs the job *inside* the specified Docker image
    container:
      image: ${{ matrix.distro == 'ubuntu' && 'ubuntu:24.04' || matrix.distro == 'fedora' && 'fedora:latest' || 'archlinux:latest' }}
      
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install dependencies
     run: |
      if [ "${{ matrix.distro }}" = "ubuntu" ]; then
        apt-get update
        apt-get install -y build-essential clang make pkg-config valgrind curl pciutils libasan8 libubsan1
      elif [ "${{ matrix.distro }}" = "fedora" ]; then
        dnf install -y gcc clang make pkgconf-pkg-config valgrind curl pciutils libasan libubsan
      elif [ "${{ matrix.distro }}" = "arch" ]; then
        pacman -Sy --noconfirm base-devel clang make pkgconf valgrind curl pciutils
      fi
      
      - name: Plain build & test
        run: |
          make clean
          make CC=${{ matrix.cc }}
          make check CC=${{ matrix.cc }}

      - name: Sanitizer build (ASan/UBSan)
        run: |
          make clean
          make CC=${{ matrix.cc }} CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude -fPIC -fvisibility=hidden -Wall -Wextra"
          make check CC=${{ matrix.cc }} CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude -fPIC -fvisibility=hidden -Wall -Wextra"

      - name: Valgrind memory check
        run: |
          make clean
          make CC=${{ matrix.cc }}
          cc -g -Iinclude examples/demo.c -L. -lcyn -o demo
          LD_LIBRARY_PATH=. valgrind --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=definite ./demo >/dev/null
